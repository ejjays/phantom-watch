<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phantom Watch - Compose/Wasm spike</title>
  <style>html,body{margin:0;height:100%;background:#000;color:#ddd}#app{height:100%}</style>
  <script type="importmap">
  { "imports": { "@js-joda/core": "./node_modules/@js-joda/core/dist/js-joda.esm.js" } }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script>
    // Called from Kotlin (external fun) to feed a <video> element: hls.js for HLS streams,
    // plain src for everything else.
    window.pwAttach = function (v, url) {
      if (v.__pwHls) { v.__pwHls.destroy(); v.__pwHls = null; }
      if (window.Hls && window.Hls.isSupported()) {
        const h = new window.Hls({ enableWorker: true });
        h.loadSource(url);
        h.attachMedia(v);
        v.__pwHls = h;
      } else {
        v.src = url;
      }
      const p = v.play();
      if (p && p.catch) p.catch(function () {});
    };
    window.pwDetach = function (v) {
      if (v.__pwHls) { v.__pwHls.destroy(); v.__pwHls = null; }
      v.removeAttribute('src');
      v.load();
    };
  </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./kotlin/PhantomWatch-spike.mjs"></script>
</body>
</html>
