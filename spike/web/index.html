<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Phantom Watch</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#121011">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phantom">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <!-- no favicon, an empty data uri stops the console 404 without adding a file -->
  <link rel="icon" href="data:,">
  <style>
    html,body{margin:0;height:100%;background:#000;color:#ddd}#app{height:100%}
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:14px;pointer-events:none}
    #boot img{width:96px;height:96px;animation:pw-pulse 1.6s ease-in-out infinite}
    #boot-msg{font:12px system-ui,sans-serif;color:#777;max-width:70ch;text-align:center}
    @keyframes pw-pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){#boot img{animation:none;opacity:.8}}
  </style>
  <script type="importmap">
  { "imports": { "@js-joda/core": "./vendor/js-joda.esm.js" } }
  </script>
  <script>
    // a 24 mb wasm leaves page black for a while, logo pulses instead of looking broken
    (function () {
      function boot() { return document.getElementById('boot'); }
      var iv = setInterval(function () {
        var b = boot();
        if (!b) return;
        var app = document.getElementById('app');
        if (app && app.childElementCount > 0) { clearInterval(iv); b.remove(); }
      }, 250);
      var seen = [];
      // console.error is a diagnostic channel (Kotlin/Wasm prints deprecation notices there),
      // only an uncaught throw rewrites tab title
      function note(kind, args, fatal) {
        var parts = [];
        for (var i = 0; i < args.length; i++) {
          var a = args[i];
          try { parts.push(a && (a.stack || a.message) ? String(a.stack || a.message) : String(a)); }
          catch (e) { parts.push('?'); }
        }
        seen.push(kind + ': ' + parts.join(' | '));
        var m = fatal && document.getElementById('boot-msg');
        if (m) m.textContent = seen.join(' // ').slice(0, 400);
        if (fatal) document.title = 'PWERR ' + seen.join(' // ').slice(0, 500);
      }
      var orig = console.error;
      console.error = function () { note('error', arguments, false); return orig.apply(console, arguments); };
      window.addEventListener('error', function (e) { note('window.error', [e.error || e.message], true); });
      window.addEventListener('unhandledrejection', function (e) { note('reject', [e.reason], true); });
    })();
  </script>
  <script>
    // web counterpart of phone AppLog FAB. every step lands in console as "[PW] tag message",
    // copy(pwDump()) in devtools hands back whole session as text
    (function () {
      var buf = window.__pwLog = [];
      window.pwLog = function (tag, msg) {
        buf.push('[' + tag + '] ' + msg);
        if (buf.length > 800) buf.shift();
        console.log('%c[PW]%c ' + tag + ' %c' + msg,
          'color:#22d3ee;font-weight:700', 'color:#f472b6', 'color:#9ca3af');
      };
      window.pwDump = function () { return buf.join('\n'); };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <!-- <video> is a dom element, so player chrome the phone draws in compose is rebuilt in
       player.js from player/PlayerStage.kt -->
  <script src="./icons.js"></script>
  <script src="./player.js"></script>
</head>
<body>
<div id="app"></div>
<div id="boot"><img src="./phantom.svg" alt="Phantom Watch"><div id="boot-msg"></div></div>
<script type="module" src="./kotlin/PhantomWatch-spike.mjs"></script>
<script>
  // localhost is a secure origin, so same file registers on dev server and on a real host
  if ('serviceWorker' in navigator) {
    addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
