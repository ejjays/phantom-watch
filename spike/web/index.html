<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phantom Watch - Compose/Wasm spike</title>
  <style>html,body{margin:0;height:100%;background:#000;color:#ddd}#app{height:100%}</style>
  <script type="importmap">
  { "imports": { "@js-joda/core": "./node_modules/@js-joda/core/dist/js-joda.esm.js" } }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script>
    // Called from Kotlin (external fun) with a JSON array of sources, best first.
    // hls.js for HLS, plain src for direct files; a fatal error moves to the next source.
    window.pwAttach = function (v, urlsJson) {
      var urls = [];
      try { urls = JSON.parse(urlsJson); } catch (e) { return; }
      var i = 0;
      function load(url) {
        if (v.__pwHls) { v.__pwHls.destroy(); v.__pwHls = null; }
        v.removeAttribute('src');
        if (window.Hls && window.Hls.isSupported()) {
          var h = new window.Hls({ enableWorker: true });
          h.on(window.Hls.Events.ERROR, function (_, d) {
            if (!d.fatal) return;
            h.destroy(); v.__pwHls = null;
            if (++i < urls.length) load(urls[i]);
          });
          h.loadSource(url);
          h.attachMedia(v);
          v.__pwHls = h;
        } else {
          v.onerror = function () { if (++i < urls.length) load(urls[i]); };
          v.src = url;
        }
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      }
      if (urls.length) load(urls[0]);
    };
    window.pwDetach = function (v) {
      if (v.__pwHls) { v.__pwHls.destroy(); v.__pwHls = null; }
      v.onerror = null;
      v.removeAttribute('src');
      v.load();
    };
  </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./kotlin/PhantomWatch-spike.mjs"></script>
</body>
</html>
