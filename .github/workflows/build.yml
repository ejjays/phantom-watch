name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repo quality
        run: python3 checks/quality.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker tests
        run: node worker/test.mjs
      - name: Provider tests
        run: node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Detekt
        run: ./gradlew :app:detekt -PcompileSdk=36 -PtargetSdk=36 -Pandroid.experimental.disableCompileSdkChecks=true
      - name: Debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Test release keystore
        # CI smoke-builds release with a throwaway key; these APKs are not distributable.
        run: |
          mkdir -p app/build
          keytool -genkeypair -v -keystore app/build/test-release.jks \
            -storepass android -keypass android -alias test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Test,O=Android,C=US"
      - name: Unit tests, debug and release build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease -PcompileSdk=36 -PtargetSdk=36 -Pandroid.experimental.disableCompileSdkChecks=true -PtestReleaseSigning=true --stacktrace
