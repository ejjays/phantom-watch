name: build-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, must contain the build number (e.g. v1.0.444)
        required: true
      publish:
        description: Publish the GitHub Release and notify users
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: check tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          code=$(git rev-list --count HEAD)
          case "$TAG" in
            *"$code"*) echo "tag $TAG carries build $code" ;;
            *) echo "tag $TAG must contain build $code"; exit 1 ;;
          esac
      - name: app config
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OS_API_KEY: ${{ secrets.OS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          CFG_URL: ${{ secrets.CFG_URL }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
        run: |
          umask 077
          {
            echo "TMDB_API_KEY=$TMDB_API_KEY"
            echo "OS_API_KEY=$OS_API_KEY"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "DEEPGRAM_API_KEY=$DEEPGRAM_API_KEY"
            echo "CFG_URL=$CFG_URL"
            echo "TELEMETRY_URL=$TELEMETRY_URL"
            echo "TELEMETRY_KEY=$TELEMETRY_KEY"
          } > local.properties
      - name: keystore
        env:
          B64: ${{ secrets.PW_RELEASE_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s\n' "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: assemble release
        env:
          PW_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          PW_RELEASE_STORE_PASSWORD: ${{ secrets.PW_RELEASE_STORE_PASSWORD }}
          PW_RELEASE_KEY_ALIAS: ${{ secrets.PW_RELEASE_KEY_ALIAS }}
          PW_RELEASE_KEY_PASSWORD: ${{ secrets.PW_RELEASE_KEY_PASSWORD }}
          PW_RELEASE_CERT_SHA256: ${{ secrets.PW_RELEASE_CERT_SHA256 }}
        run: ./gradlew :app:assembleRelease -PcompileSdk=36 -PtargetSdk=36 -Pandroid.experimental.disableCompileSdkChecks=true
      - name: verify certificate
        env:
          EXPECTED: ${{ secrets.PW_RELEASE_CERT_SHA256 }}
        run: |
          apksigner=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | sed 's/.*:[[:space:]]*//' | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          expected=$(printf '%s' "$EXPECTED" | tr -d ':\r\n' | tr 'A-Z' 'a-z')
          echo "apk cert $actual"
          echo "pinned cert $expected"
          test -n "$actual"
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: publish
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
