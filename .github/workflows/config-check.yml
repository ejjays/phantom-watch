name: config-check
on:
  push:
    paths:
      - app/src/main/assets/providers.js
      - app/src/main/assets/providers.json
      - probe.js
      - sign_config.py
      - checks/config_rules.py
      - .github/workflows/config-check.yml
  pull_request:
    paths:
      - app/src/main/assets/providers.js
      - app/src/main/assets/providers.json
      - probe.js
      - sign_config.py
      - checks/config_rules.py
      - .github/workflows/config-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS syntax
        run: |
          node --check app/src/main/assets/providers.js
          node --check probe.js
      - name: Config schema
        run: python3 checks/config_rules.py app/src/main/assets/providers.json app/src/main/assets/providers.js
      - name: Python syntax
        run: python3 -m py_compile sign_config.py
